[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["node_modules", "reports", "venv_dev"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"pages/locators/__init__.py" = ["F401"]
"pages/project_page.py" = ["F541"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
